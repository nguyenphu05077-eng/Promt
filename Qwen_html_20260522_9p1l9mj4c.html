<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Prompt Manager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            accent: { 500: '#8b5cf6', 600: '#7c3aed' }
          },
          animation: {
            'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'slide-in': 'slideIn 0.3s ease-out',
            'fade-in': 'fadeIn 0.2s ease-out'
          },
          keyframes: {
            slideIn: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * { font-family: 'Inter', system-ui, sans-serif; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Mic Button Animation */
    .mic-button {
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .mic-button::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .mic-button:hover::after { opacity: 0.1; }
    .mic-button.recording {
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: white !important;
      animation: pulse-ring 1.5s ease-out infinite;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    /* Card Hover Effects */
    .prompt-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 4px solid transparent;
    }
    .prompt-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      border-left-color: #6366f1;
    }
    
    /* Category Badge */
    .category-badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 500;
      transition: all 0.2s;
    }
    .category-badge:hover { filter: brightness(1.1); }
    
    /* Input Focus */
    .input-focus {
      transition: all 0.2s;
      border-color: #cbd5e1;
    }
    .input-focus:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      outline: none;
    }
    
    /* Button Ripple */
    .btn-ripple {
      position: relative;
      overflow: hidden;
    }
    .btn-ripple::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s ease-out;
      pointer-events: none;
    }
    .btn-ripple:active::after { transform: scale(2); }
    
    /* Toast Notification */
    .toast {
      animation: slideInRight 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(100%); }
    }
    
    /* Dark mode transitions */
    .dark-transition { transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
    
    /* Empty State Animation */
    .empty-state { animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    /* URL Link Styling */
    .url-link {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .url-link:hover { opacity: 0.8; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 min-h-screen p-4 dark-transition">
  
  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <!-- Main Container -->
  <div class="max-w-6xl mx-auto">
    
    <!-- Header -->
    <header class="text-center mb-8 animate-fade-in">
      <div class="inline-flex items-center gap-3 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm px-6 py-3 rounded-2xl shadow-lg mb-4">
        <span class="text-3xl">🎯</span>
        <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
          Prompt Manager Pro
        </h1>
      </div>
      <p class="text-slate-600 dark:text-slate-300">Quản lý thông minh - Sử dụng hiệu quả</p>
    </header>

    <!-- Main Card -->
    <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm shadow-xl rounded-3xl p-6 md:p-8 dark-transition">
      
      <!-- Top Controls: Dark Mode + Stats -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-6 border-b border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-4">
          <span class="text-sm text-slate-500 dark:text-slate-400">
            <i class="fas fa-database mr-1"></i>
            <strong id="promptCount" class="text-indigo-600 dark:text-indigo-400">0</strong> prompts
          </span>
          <span class="text-sm text-slate-500 dark:text-slate-400">
            <i class="fas fa-folder mr-1"></i>
            <strong id="categoryCount" class="text-purple-600 dark:text-purple-400">0</strong> danh mục
          </span>
        </div>
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" title="Chế độ tối">
          <i class="fas fa-moon dark:hidden text-slate-600"></i>
          <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
        </button>
      </div>

      <!-- Add Prompt Form -->
      <div class="bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-slate-700/50 dark:to-slate-700/30 rounded-2xl p-5 mb-6 dark-transition">
        <h3 class="font-semibold text-slate-700 dark:text-slate-200 mb-4 flex items-center gap-2">
          <i class="fas fa-plus-circle text-indigo-500"></i>
          Thêm Prompt Mới
        </h3>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <!-- Title Input -->
          <div class="relative group">
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Tiêu đề</label>
            <div class="flex items-center gap-2">
              <input id="title" type="text" placeholder="VD: Giải toán tích phân..." 
                class="input-focus flex-1 border rounded-xl px-4 py-2.5 bg-white dark:bg-slate-700 dark:text-white dark:placeholder-slate-400" />
              <button id="mic-title" class="mic-button w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400" title="Nhập bằng giọng nói">
                <i class="fas fa-microphone"></i>
              </button>
            </div>
          </div>
          
          <!-- Content Input -->
          <div class="relative md:col-span-2">
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Nội dung hoặc URL</label>
            <div class="flex items-center gap-2">
              <input id="content" type="text" placeholder="Nhập prompt hoặc dán URL..." 
                class="input-focus flex-1 border rounded-xl px-4 py-2.5 bg-white dark:bg-slate-700 dark:text-white dark:placeholder-slate-400" />
              <button id="mic-content" class="mic-button w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400" title="Nhập bằng giọng nói">
                <i class="fas fa-microphone"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
          <!-- Category Input -->
          <div class="relative">
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Danh mục</label>
            <div class="flex items-center gap-2">
              <input id="category" type="text" placeholder="VD: Toán, AI, Viết lách..." 
                class="input-focus flex-1 border rounded-xl px-4 py-2.5 bg-white dark:bg-slate-700 dark:text-white dark:placeholder-slate-400" />
              <button id="mic-category" class="mic-button w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400" title="Nhập bằng giọng nói">
                <i class="fas fa-microphone"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-3">
          <button onclick="addPrompt()" class="btn-ripple bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all hover:shadow-indigo-500/40">
            <i class="fas fa-plus"></i>
            <span id="addBtnText">Thêm Prompt</span>
          </button>
          <button onclick="exportPrompts()" class="btn-ripple bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-emerald-500/25 flex items-center gap-2 transition-all hover:shadow-emerald-500/40">
            <i class="fas fa-download"></i> Xuất JSON
          </button>
          <button onclick="document.getElementById('importFile').click()" class="btn-ripple bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-amber-500/25 flex items-center gap-2 transition-all hover:shadow-amber-500/40">
            <i class="fas fa-upload"></i> Nhập JSON
          </button>
          <input type="file" id="importFile" class="hidden" accept=".json" onchange="importPrompts(event)" />
          
          <div class="flex-1"></div>
          
          <div class="flex items-center gap-2">
            <input id="deleteCategoryInput" type="text" placeholder="Xoá danh mục..." 
              class="input-focus border rounded-xl px-4 py-2.5 text-sm bg-white dark:bg-slate-700 dark:text-white dark:placeholder-slate-400" />
            <button onclick="deleteCategory()" class="btn-ripple bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-lg shadow-rose-500/25 flex items-center gap-2 transition-all hover:shadow-rose-500/40">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- View Controls -->
      <div class="flex flex-wrap items-center gap-4 mb-6 pb-6 border-b border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-3">
          <label class="text-sm font-medium text-slate-600 dark:text-slate-300">Hiển thị:</label>
          <select id="viewMode" onchange="renderPrompts()" 
            class="input-focus border rounded-xl px-4 py-2 bg-white dark:bg-slate-700 dark:text-white text-sm">
            <option value="grouped">📁 Theo danh mục</option>
            <option value="all">📋 Tất cả prompt</option>
          </select>
        </div>
        
        <div id="categoryFilterWrap" class="flex items-center gap-3 hidden">
          <label class="text-sm font-medium text-slate-600 dark:text-slate-300">Lọc:</label>
          <select id="categoryFilter" onchange="renderPrompts()" 
            class="input-focus border rounded-xl px-4 py-2 bg-white dark:bg-slate-700 dark:text-white text-sm">
            <option value="all">✨ Tất cả</option>
          </select>
        </div>
        
        <div class="flex-1"></div>
        
        <div class="relative w-full md:w-72">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="search" oninput="renderPrompts()" type="text" 
            placeholder="🔍 Tìm kiếm prompt..." 
            class="input-focus w-full border rounded-xl pl-10 pr-4 py-2.5 bg-white dark:bg-slate-700 dark:text-white dark:placeholder-slate-400" />
        </div>
      </div>

      <!-- Voice Status -->
      <div id="voice-status" class="text-center text-sm text-slate-500 dark:text-slate-400 mb-4 min-h-[1.5rem] transition-all"></div>

      <!-- Prompt List -->
      <div id="promptList" class="space-y-4 min-h-[200px]"></div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <div class="empty-state inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-100 to-purple-100 dark:from-indigo-900/30 dark:to-purple-900/30 rounded-2xl mb-4">
          <i class="fas fa-robot text-3xl text-indigo-500"></i>
        </div>
        <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-2">Chưa có prompt nào</h3>
        <p class="text-slate-500 dark:text-slate-400 mb-4">Hãy thêm prompt đầu tiên của bạn!</p>
        <button onclick="document.getElementById('title').focus()" 
          class="btn-ripple bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium transition-colors">
          <i class="fas fa-plus mr-2"></i>Thêm ngay
        </button>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="mt-8 flex justify-center gap-2"></div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-8 text-sm text-slate-500 dark:text-slate-400">
      <p>Dữ liệu được lưu trữ cục bộ trong trình duyệt của bạn 🔐</p>
    </footer>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl animate-slide-in">
      <div class="text-center mb-4">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-rose-100 dark:bg-rose-900/30 rounded-full mb-3">
          <i class="fas fa-exclamation-triangle text-2xl text-rose-500"></i>
        </div>
        <h3 id="modalTitle" class="text-lg font-semibold text-slate-800 dark:text-white">Xác nhận</h3>
        <p id="modalMessage" class="text-slate-500 dark:text-slate-400 mt-2">Bạn có chắc muốn thực hiện hành động này?</p>
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 btn-ripple bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl font-medium transition-colors">
          Huỷ
        </button>
        <button id="modalConfirm" class="flex-1 btn-ripple bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl font-medium transition-colors">
          Xác nhận
        </button>
      </div>
    </div>
  </div>

  <script>
    // ===== STATE MANAGEMENT =====
    let prompts = JSON.parse(localStorage.getItem("prompts")) || [];
    let editingIndex = -1;
    const itemsPerPage = 5;
    let currentPage = 1;
    let recognition;
    let isRecording = false;
    let currentMicTarget = null;
    let confirmCallback = null;

    // ===== DARK MODE =====
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
    }
    
    // Init dark mode
    if (localStorage.getItem('darkMode') === 'true' || 
        (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    // ===== TOAST NOTIFICATIONS =====
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
      const colors = {
        success: 'from-emerald-500 to-emerald-600',
        error: 'from-rose-500 to-rose-600',
        info: 'from-blue-500 to-blue-600',
        warning: 'from-amber-500 to-amber-600'
      };
      
      toast.className = `toast bg-gradient-to-r ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[280px]`;
      toast.innerHTML = `
        <span class="text-lg font-bold">${icons[type]}</span>
        <span class="flex-1 text-sm font-medium">${message}</span>
        <button onclick="this.parentElement.remove()" class="hover:bg-white/20 rounded-lg p-1 transition-colors">
          <i class="fas fa-times text-sm"></i>
        </button>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ===== MODAL =====
    function showModal(title, message, onConfirm) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('confirmModal').classList.remove('hidden');
      confirmCallback = onConfirm;
    }
    
    function closeModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      confirmCallback = null;
    }
    
    document.getElementById('modalConfirm').onclick = () => {
      if (confirmCallback) confirmCallback();
      closeModal();
    };

    // ===== SPEECH RECOGNITION =====
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const statusEl = document.getElementById('voice-status');
      
      if (!SpeechRecognition) {
        statusEl.innerHTML = '<span class="text-amber-500"><i class="fas fa-exclamation-circle mr-1"></i>Trình duyệt không hỗ trợ nhận diện giọng nói. Dùng Chrome để trải nghiệm tốt nhất.</span>';
        document.querySelectorAll('.mic-button').forEach(btn => btn.disabled = true);
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        currentMicTarget?.classList.add('recording');
        statusEl.innerHTML = '<span class="text-indigo-500 animate-pulse"><i class="fas fa-microphone-alt mr-1"></i>Đang nghe...</span>';
      };

      recognition.onend = () => {
        isRecording = false;
        currentMicTarget?.classList.remove('recording');
        if (statusEl.textContent.includes('Đang nghe')) {
          statusEl.textContent = '';
        }
      };

      recognition.onerror = (event) => {
        isRecording = false;
        currentMicTarget?.classList.remove('recording');
        const errors = {
          'no-speech': 'Không nhận được giọng nói',
          'audio-capture': 'Không tìm thấy microphone',
          'not-allowed': 'Chưa cấp quyền microphone'
        };
        showToast(errors[event.error] || 'Lỗi nhận diện giọng nói', 'error');
        statusEl.textContent = '';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (currentMicTarget?.id === 'mic-title') {
          document.getElementById('title').value = transcript;
        } else if (currentMicTarget?.id === 'mic-content') {
          document.getElementById('content').value = transcript;
        } else if (currentMicTarget?.id === 'mic-category') {
          document.getElementById('category').value = transcript;
        }
        showToast(`🎤 "${transcript}"`, 'info');
        statusEl.textContent = '';
      };
    }

    function toggleMic(targetId) {
      if (!recognition) {
        showToast('Trình duyệt không hỗ trợ tính năng này', 'error');
        return;
      }
      currentMicTarget = document.getElementById(targetId);
      isRecording ? recognition.stop() : recognition.start();
    }

    // ===== RENDER FUNCTIONS =====
    function renderPrompts() {
      updateStats();
      
      const viewMode = document.getElementById('viewMode')?.value || 'grouped';
      const categoryFilterWrap = document.getElementById("categoryFilterWrap");
      const categoryFilter = document.getElementById("categoryFilter");
      
      viewMode === "grouped" 
        ? categoryFilterWrap.classList.remove("hidden") 
        : categoryFilterWrap.classList.add("hidden");

      const search = document.getElementById("search").value.toLowerCase();
      const promptList = document.getElementById("promptList");
      const emptyState = document.getElementById("emptyState");
      
      const filtered = prompts.filter(p =>
        p.title.toLowerCase().includes(search) || 
        p.content.toLowerCase().includes(search) ||
        p.category.toLowerCase().includes(search) ||
        (p.url && p.url.toLowerCase().includes(search))
      );

      if (filtered.length === 0) {
        promptList.innerHTML = "";
        emptyState.classList.remove('hidden');
        document.getElementById("pagination").innerHTML = "";
        return;
      }
      emptyState.classList.add('hidden');

      if (viewMode === "all") {
        renderFlatList(filtered, promptList);
        renderPagination(1);
        return;
      }

      renderGroupedList(filtered, promptList, categoryFilter);
    }

    function renderFlatList(prompts, container) {
      container.innerHTML = prompts.map((p, idx) => {
        const index = prompts.findIndex(x => x.title === p.title && x.category === p.category);
        return createPromptCard(p, index);
      }).join('');
    }

    function renderGroupedList(filtered, container, categoryFilter) {
      const categories = {};
      filtered.forEach(p => {
        if (!categories[p.category]) categories[p.category] = [];
        categories[p.category].push(p);
      });

      // Update category filter dropdown
      if (categoryFilter) {
        const currentValue = categoryFilter.value;
        categoryFilter.innerHTML = '<option value="all">✨ Tất cả</option>';
        Object.keys(categories).sort().forEach(cat => {
          categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
        categoryFilter.value = currentValue;
      }

      let categoryKeys = Object.keys(categories).sort();
      const selectedCategory = categoryFilter?.value || "all";
      if (selectedCategory !== "all") {
        categoryKeys = categoryKeys.filter(cat => cat === selectedCategory);
      }

      const totalPages = Math.ceil(categoryKeys.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const visibleCategories = categoryKeys.slice(start, start + itemsPerPage);

      container.innerHTML = visibleCategories.map(cat => `
        <div class="animate-fade-in">
          <div class="flex items-center gap-3 mb-3 pb-2 border-b border-slate-200 dark:border-slate-700">
            <span class="category-badge px-3 py-1 rounded-full text-sm">${cat}</span>
            <span class="text-xs text-slate-400">${categories[cat].length} prompt${categories[cat].length > 1 ? 's' : ''}</span>
          </div>
          ${categories[cat].map(p => {
            const index = prompts.findIndex(x => x.title === p.title && x.category === p.category);
            return createPromptCard(p, index);
          }).join('')}
        </div>
      `).join('');

      renderPagination(totalPages);
    }

    function createPromptCard(p, index) {
      const isUrl = p.url || p.content.startsWith('http');
      const displayContent = isUrl 
        ? `<a href="${p.url || p.content}" target="_blank" class="url-link break-all hover:underline">
            <i class="fas fa-link mr-1"></i>${p.url || p.content}
          </a>
          ${p.url ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${p.content}</p>` : ''}`
        : `<p class="text-slate-700 dark:text-slate-200">${p.content}</p>`;

      return `
        <div class="prompt-card bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-2xl p-4 dark-transition">
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex-1 min-w-0">
              <h4 class="font-semibold text-slate-800 dark:text-white truncate">${p.title}</h4>
            </div>
            <div class="flex gap-1.5 shrink-0">
              <button onclick="copyPrompt(${index})" class="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors" title="Sao chép">
                <i class="fas fa-copy"></i>
              </button>
              <button onclick="editPrompt(${index})" class="p-2 text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 rounded-lg transition-colors" title="Chỉnh sửa">
                <i class="fas fa-pen"></i>
              </button>
              <button onclick="deletePrompt(${index})" class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg transition-colors" title="Xoá">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <div class="text-sm text-slate-600 dark:text-slate-300 space-y-2">
            ${displayContent}
          </div>
        </div>
      `;
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById("pagination");
      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }
      
      pagination.innerHTML = Array.from({length: totalPages}, (_, i) => {
        const page = i + 1;
        const isActive = page === currentPage;
        return `
          <button onclick="goToPage(${page})" 
            class="w-10 h-10 rounded-xl font-medium transition-all ${
              isActive 
                ? 'bg-gradient-to-r from-indigo-500 to-indigo-600 text-white shadow-lg shadow-indigo-500/30' 
                : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
            }">
            ${page}
          </button>
        `;
      }).join('');
    }

    function goToPage(page) {
      currentPage = page;
      renderPrompts();
      // Smooth scroll to top of list
      document.getElementById('promptList')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ===== CRUD OPERATIONS =====
    function addPrompt() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const category = document.getElementById("category").value.trim();
      
      if (!title || !content || !category) {
        showToast('Vui lòng nhập đầy đủ thông tin', 'warning');
        return;
      }
      
      const promptData = { title, content, category };
      if (content.startsWith('http://') || content.startsWith('https://')) {
        promptData.url = content;
      }

      if (editingIndex >= 0) {
        prompts[editingIndex] = promptData;
        editingIndex = -1;
        document.getElementById('addBtnText').textContent = 'Thêm Prompt';
        showToast('✅ Đã cập nhật prompt', 'success');
      } else {
        prompts.push(promptData);
        showToast('✅ Đã thêm prompt mới', 'success');
      }
      
      // Clear form
      ["title", "content", "category"].forEach(id => document.getElementById(id).value = "");
      currentPage = 1;
      renderPrompts();
      savePrompts();
    }

    function deletePrompt(index) {
      showModal('Xoá prompt', 'Bạn có chắc muốn xoá prompt này?', () => {
        const deleted = prompts.splice(index, 1)[0];
        showToast(`🗑️ Đã xoá "${deleted.title}"`, 'info');
        renderPrompts();
        savePrompts();
      });
    }

    function editPrompt(index) {
      const p = prompts[index];
      document.getElementById("title").value = p.title;
      document.getElementById("content").value = p.url || p.content;
      document.getElementById("category").value = p.category;
      editingIndex = index;
      document.getElementById('addBtnText').textContent = 'Cập nhật';
      document.getElementById("title").focus();
      showToast('✏️ Đang chỉnh sửa - nhấn "Cập nhật" để lưu', 'info');
    }

    function copyPrompt(index) {
      const p = prompts[index];
      const text = p.url ? `${p.title}\n${p.url}\n\n${p.content}` : `${p.title}\n\n${p.content}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 Đã sao chép vào clipboard!', 'success');
      }).catch(() => {
        showToast('Không thể sao chép', 'error');
      });
    }

    function deleteCategory() {
      const cat = document.getElementById("deleteCategoryInput").value.trim();
      if (!cat) {
        showToast('Vui lòng nhập tên danh mục', 'warning');
        return;
      }
      
      const count = prompts.filter(p => p.category === cat).length;
      if (count === 0) {
        showToast(`Không tìm thấy prompt trong "${cat}"`, 'info');
        return;
      }
      
      showModal('Xoá danh mục', `Xoá ${count} prompt trong danh mục "${cat}"?`, () => {
        prompts = prompts.filter(p => p.category !== cat);
        showToast(`🗑️ Đã xoá ${count} prompt trong "${cat}"`, 'success');
        document.getElementById("deleteCategoryInput").value = "";
        renderPrompts();
        savePrompts();
      });
    }

    // ===== IMPORT/EXPORT =====
    function exportPrompts() {
      if (prompts.length === 0) {
        showToast('Không có dữ liệu để xuất', 'warning');
        return;
      }
      const blob = new Blob([JSON.stringify(prompts, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `prompts-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('📥 Đã tải file JSON', 'success');
    }

    function importPrompts(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('Dữ liệu không hợp lệ');
          
          const valid = imported.filter(p => p.title && p.content && p.category);
          const existing = new Set(prompts.map(p => p.title + '|' + p.category));
          const newOnes = valid.filter(p => !existing.has(p.title + '|' + p.category));
          
          prompts = [...prompts, ...newOnes];
          showToast(`✅ Nhập ${newOnes.length} prompt mới`, 'success');
          renderPrompts();
          savePrompts();
        } catch (err) {
          showToast('❌ Lỗi đọc file: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset input
    }

    // ===== UTILS =====
    function updateStats() {
      document.getElementById('promptCount').textContent = prompts.length;
      const uniqueCats = new Set(prompts.map(p => p.category)).size;
      document.getElementById('categoryCount').textContent = uniqueCats;
    }

    function savePrompts() {
      localStorage.setItem("prompts", JSON.stringify(prompts));
      updateStats();
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      setupSpeechRecognition();
      
      // Mic button listeners
      ['title', 'content', 'category'].forEach(field => {
        document.getElementById(`mic-${field}`)?.addEventListener('click', () => toggleMic(`mic-${field}`));
      });
      
      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && editingIndex >= 0) {
          editingIndex = -1;
          document.getElementById('addBtnText').textContent = 'Thêm Prompt';
          ["title", "content", "category"].forEach(id => document.getElementById(id).value = "");
          showToast('Đã huỷ chỉnh sửa', 'info');
        }
      });
      
      // Enter key to add prompt
      ['title', 'content', 'category'].forEach(id => {
        document.getElementById(id)?.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') addPrompt();
        });
      });
      
      renderPrompts();
      showToast('👋 Chào mừng đến với Prompt Manager Pro!', 'info');
    });

    // Close modal on backdrop click
    document.getElementById('confirmModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'confirmModal') closeModal();
    });
  </script>
</body>
</html>
